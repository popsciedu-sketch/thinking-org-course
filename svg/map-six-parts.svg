<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <rect width="720" height="220" fill="#f7f9fc"/>
  <text x="360" y="28" text-anchor="middle" fill="#2f5aa8" font-size="16" font-family="sans-serif">思考的整理學 · 六部地圖</text>
  <rect x="10" y="50" width="100" height="70" rx="14" fill="#2f5aa8"/><text x="60" y="82" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Ⅰ 飛行</text>
  <rect x="130" y="50" width="100" height="70" rx="14" fill="#3d6bb8"/><text x="180" y="82" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Ⅱ 發酵</text>
  <rect x="250" y="50" width="100" height="70" rx="14" fill="#4a7fd4"/><text x="300" y="82" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Ⅲ 蒐集</text>
  <rect x="370" y="50" width="100" height="70" rx="14" fill="#5b8fe0"/><text x="420" y="82" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Ⅳ 整理</text>
  <rect x="490" y="50" width="100" height="70" rx="14" fill="#6a9ae8"/><text x="540" y="82" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Ⅴ 表達</text>
  <rect x="610" y="50" width="100" height="70" rx="14" fill="#89b1f4"/><text x="660" y="82" text-anchor="middle" fill="#2f5aa8" font-size="13" font-family="sans-serif">Ⅵ 進階</text>
  <rect x="130" y="145" width="460" height="50" rx="12" fill="#e8f1fc" stroke="#a8c6ef"/>
  <text x="360" y="175" text-anchor="middle" fill="#2f5aa8" font-size="14" font-family="sans-serif">滑翔機 → 飛機人：發酵・編輯・遺忘・表達</text>
</svg>
